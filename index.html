<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Kho QR Cloud v3.0</title>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <!-- UI & QR Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap');
        body { font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .hidden { display: none !important; }
        .qr-canvas canvas { display: inline-block !important; border: 4px solid white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-active:active { transform: scale(0.96); transition: 0.1s; }
        #reader video { border-radius: 24px !important; object-fit: cover !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- LOADER (Màn hình chờ) -->
    <div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
        <div class="w-14 h-14 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-black text-blue-600 tracking-tighter animate-pulse uppercase">Hệ thống đang sẵn sàng...</p>
    </div>

    <!-- TRANG XÁC THỰC (Đăng nhập/Đăng ký) -->
    <div id="auth-page" class="hidden min-h-screen flex items-center justify-center p-4 bg-blue-600">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md">
            <h2 id="auth-title" class="text-3xl font-extrabold text-center text-slate-800 mb-8 uppercase tracking-tighter">Đăng Nhập</h2>
            
            <div id="login-form" class="space-y-4">
                <input type="text" id="login-user" placeholder="SĐT hoặc 'Admin'" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-semibold transition-all">
                <input type="password" id="login-pass" placeholder="Mật khẩu" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-semibold transition-all">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-lg shadow-lg btn-active uppercase">Vào hệ thống</button>
                <button onclick="toggleAuth(true)" class="w-full text-blue-600 font-bold text-sm text-center">Chưa có tài khoản? Đăng ký tại đây</button>
            </div>

            <div id="register-form" class="hidden space-y-4">
                <input type="text" id="reg-name" placeholder="Họ tên nhân viên" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500 font-semibold transition-all">
                <input type="text" id="reg-phone" placeholder="Số điện thoại" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500 font-semibold transition-all">
                <input type="password" id="reg-pass" placeholder="Mật khẩu tự chọn" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500 font-semibold transition-all">
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-black text-lg shadow-lg btn-active uppercase">Xác nhận đăng ký</button>
                <button onclick="toggleAuth(false)" class="w-full text-slate-500 font-bold text-sm text-center block">Quay lại Đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- TRANG CHỦ ADMIN -->
    <div id="admin-page" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black italic">K</div>
                <span class="font-black text-slate-800 uppercase tracking-tighter text-lg">Quản Lý Kho</span>
            </div>
            <button onclick="logout()" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl font-black text-[10px] uppercase border border-red-100">Đăng xuất</button>
        </nav>

        <main class="p-4 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Cột trái: Nhập hàng -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-black text-slate-800 mb-6 text-xs uppercase tracking-widest text-blue-600">Nhập sản phẩm mới</h3>
                    <div class="space-y-4">
                        <input type="text" id="p-name" placeholder="Tên sản phẩm" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                        <input type="text" id="p-id" placeholder="Mã QR định danh" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 uppercase font-semibold">
                        <input type="number" id="p-stock" placeholder="Số lượng nhập" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                        <button onclick="adminAddProduct()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black shadow-md btn-active uppercase">Lưu vào Database</button>
                    </div>
                </div>

                <!-- Bảng quản lý nhân viên (Theo yêu cầu) -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-800 text-white font-black text-[10px] uppercase tracking-widest">Danh sách mật khẩu nhân viên</div>
                    <div class="max-h-64 overflow-y-auto custom-scroll">
                        <table class="w-full text-left text-xs">
                            <tbody id="admin-staff-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Kho hàng -->
            <div class="lg:col-span-8 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 bg-slate-50/50 border-b flex justify-between items-center font-black text-[10px] uppercase text-slate-500">
                    <span>Hàng tồn kho thực tế</span>
                    <span id="total-items" class="bg-blue-600 text-white px-2 py-0.5 rounded italic">0 SP</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="text-[10px] text-slate-400 font-black uppercase border-b">
                            <tr><th class="p-6">Mã QR</th><th class="p-6">Sản phẩm</th><th class="p-6 text-center">Tồn</th><th class="p-6 text-right">Quản lý</th></tr>
                        </thead>
                        <tbody id="admin-inventory-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- TRANG CHỦ NHÂN VIÊN -->
    <div id="staff-page" class="hidden min-h-screen bg-slate-100">
        <nav class="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-50">
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nhân viên trực kho</p>
                <p id="staff-display-name" class="font-black text-blue-600 text-lg"></p>
            </div>
            <button onclick="logout()" class="text-slate-400 font-bold text-xs uppercase underline">Thoát</button>
        </nav>

        <div class="p-4 max-w-md mx-auto space-y-6">
            <button onclick="openScanner()" class="w-full bg-blue-600 text-white p-8 rounded-[2.5rem] font-black text-xl shadow-2xl flex items-center justify-center gap-4 btn-active border-b-8 border-blue-800">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                QUÉT MÃ LẤY HÀNG
            </button>

            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400 text-center tracking-widest">Danh sách xem tồn kho</div>
                <div id="staff-inventory-list" class="divide-y divide-slate-100 max-h-[50vh] overflow-y-auto custom-scroll"></div>
            </div>
        </div>
    </div>

    <!-- SCANNER MODAL (Lớp phủ camera) -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden flex flex-col items-center justify-center p-6">
        <div id="reader" class="w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl border-4 border-white"></div>
        <button onclick="closeScanner()" class="mt-8 bg-white/20 text-white px-10 py-4 rounded-full font-black uppercase text-xs tracking-widest backdrop-blur-md btn-active">Đóng máy quét</button>
    </div>

    <!-- TOAST NOTIFICATIONS (Thông báo cho Admin) -->
    <div id="toast-container" class="fixed bottom-6 right-6 w-80 space-y-3 z-[9999] pointer-events-none"></div>

    <script>
        // --- CẤU HÌNH FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDc-VCCLr_IeQIH42OYsyLjOaQq5YgJ5DE",
            authDomain: "khoqr-d67fd.firebaseapp.com",
            databaseURL: "https://khoqr-d67fd-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "khoqr-d67fd",
            storageBucket: "khoqr-d67fd.firebasestorage.app",
            messagingSenderId: "100113337906",
            appId: "1:100113337906:web:83b8cfc0b2d3679b8e362b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let currentUser = JSON.parse(localStorage.getItem('kho_session_v3'));
        let scanner = null;

        // --- HÀM KHỞI CHẠY (QUAN TRỌNG) ---
        window.onload = () => {
            // Tự động xác thực ngầm để được quyền truy cập Database
            auth.signInAnonymously().then(() => {
                document.getElementById('loader').classList.add('hidden');
                if(currentUser) { renderUI(); } 
                else { document.getElementById('auth-page').classList.remove('hidden'); }
            }).catch(err => {
                console.error("Firebase Auth Error:", err);
                alert("Lỗi kết nối máy chủ! Hãy kiểm tra Internet.");
            });
        };

        function renderUI() {
            document.getElementById('auth-page').classList.add('hidden');
            if(currentUser.role === 'admin') {
                document.getElementById('admin-page').classList.remove('hidden');
                initAdmin();
            } else {
                document.getElementById('staff-page').classList.remove('hidden');
                document.getElementById('staff-display-name').innerText = currentUser.name;
                initStaff();
            }
        }

        // --- LOGIC ĐĂNG KÝ / ĐĂNG NHẬP ---
        function toggleAuth(isReg) {
            document.getElementById('login-form').classList.toggle('hidden', isReg);
            document.getElementById('register-form').classList.toggle('hidden', !isReg);
            document.getElementById('auth-title').innerText = isReg ? 'Đăng Ký' : 'Đăng Nhập';
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            if(!name || !phone || !pass) return alert("Vui lòng điền đủ 3 thông tin!");

            db.ref('users/' + phone).set({ name, phone, pass, role: 'staff' }, (err) => {
                if(!err) {
                    alert("Đăng ký thành công! Hãy dùng Số điện thoại này để Đăng nhập.");
                    // Xóa dữ liệu cũ và quay về đăng nhập ngay lập tức
                    document.getElementById('reg-name').value = ""; document.getElementById('reg-phone').value = ""; document.getElementById('reg-pass').value = "";
                    toggleAuth(false);
                } else { alert("Lỗi: Không có quyền ghi dữ liệu."); }
            });
        }

        function handleLogin() {
            const userIn = document.getElementById('login-user').value.trim();
            const passIn = document.getElementById('login-pass').value.trim();

            if(userIn === 'Admin' && passIn === '3032002') {
                saveSession({ name: 'Chủ Kho', role: 'admin' });
            } else {
                db.ref('users/' + userIn).once('value', (s) => {
                    const u = s.val();
                    if(u && u.pass === passIn) saveSession(u);
                    else alert("Sai tài khoản hoặc mật khẩu!");
                });
            }
        }

        function saveSession(u) {
            localStorage.setItem('kho_session_v3', JSON.stringify(u));
            location.reload();
        }

        function logout() { localStorage.removeItem('kho_session_v3'); location.reload(); }

        // --- LOGIC ADMIN (DÀNH CHO BẠN) ---
        function initAdmin() {
            // Danh sách sản phẩm
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('admin-inventory-list');
                list.innerHTML = "";
                let count = 0;
                for(let id in data) {
                    count++;
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-slate-50 transition border-b border-slate-50">
                            <td class="p-6"><div id="qr-${id}" class="qr-canvas" onclick="printLargeQR('${id}')"></div></td>
                            <td class="p-6"><b class="text-slate-700 text-lg block">${item.name}</b><span class="text-[10px] text-slate-300 font-mono tracking-widest uppercase">${id}</span></td>
                            <td class="p-6 text-center text-3xl font-black text-blue-600">${item.stock}</td>
                            <td class="p-6 text-right space-y-2">
                                <button onclick="adminEditStock('${id}')" class="text-blue-500 font-black text-[10px] uppercase block ml-auto">Nhập hàng</button>
                                <button onclick="adminDeleteItem('${id}')" class="text-red-300 font-black text-[10px] uppercase block ml-auto">Xóa bỏ</button>
                            </td>
                        </tr>
                    `);
                    new QRCode(document.getElementById(`qr-${id}`), { text: id, width: 64, height: 64 });
                }
                document.getElementById('total-items').innerText = `${count} SP`;
            });

            // Danh sách mật khẩu nhân viên
            db.ref('users').on('value', (s) => {
                const users = s.val();
                const list = document.getElementById('admin-staff-list');
                list.innerHTML = "";
                for(let phone in users) {
                    const u = users[phone];
                    if(u.role === 'staff') {
                        list.insertAdjacentHTML('beforeend', `
                            <tr class="text-[11px]">
                                <td class="p-3 font-bold text-slate-700">${u.name}</td>
                                <td class="p-3 text-slate-400 font-mono">${u.phone}</td>
                                <td class="p-3 text-blue-500 font-black text-center tracking-widest">${u.pass}</td>
                                <td class="p-3 text-right"><button onclick="adminDeleteUser('${phone}')" class="text-red-200 font-bold text-lg">✕</button></td>
                            </tr>
                        `);
                    }
                }
            });

            // Lắng nghe thông báo lấy hàng mới
            db.ref('logs').limitToLast(1).on('child_added', (s) => {
                const log = s.val();
                if(Date.now() - log.time < 5000) showAdminToast(log.staff, log.prod, log.qty);
            });
        }

        function adminAddProduct() {
            const name = document.getElementById('p-name').value.trim();
            const id = document.getElementById('p-id').value.toUpperCase().trim();
            const stock = parseInt(document.getElementById('p-stock').value);
            if(!name || !id || isNaN(stock)) return alert("Hãy nhập đủ Tên, Mã QR và Số lượng!");
            db.ref('inventory/' + id).set({ name, stock }, () => {
                document.getElementById('p-name').value = ""; document.getElementById('p-id').value = ""; document.getElementById('p-stock').value = "";
            });
        }

        function adminEditStock(id) {
            const n = prompt("Số lượng thực tế mới trong kho là bao nhiêu?");
            if(n !== null) db.ref('inventory/' + id + '/stock').set(parseInt(n));
        }

        function adminDeleteItem(id) { if(confirm("Xóa vĩnh viễn sản phẩm này?")) db.ref('inventory/' + id).remove(); }
        function adminDeleteUser(phone) { if(confirm("Xóa tài khoản nhân viên này?")) db.ref('users/' + phone).remove(); }

        function printLargeQR(id) {
            const win = window.open('', '_blank');
            win.document.write(`<html><body style="text-align:center;padding-top:100px;font-family:sans-serif">
                <h1>MÃ QR: ${id}</h1>
                <div id="print-qr" style="display:inline-block"></div>
                <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
                <script>new QRCode(document.getElementById("print-qr"), {text:"${id}", width:300, height:300}); setTimeout(()=>window.print(), 500);<\/script>
            </body></html>`);
            win.document.close();
        }

        // --- LOGIC NHÂN VIÊN ---
        function initStaff() {
            // Xem kho hàng trực tuyến
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('staff-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <div class="p-5 flex justify-between items-center bg-white border-b border-slate-50">
                            <div><p class="font-bold text-slate-700">${item.name}</p><p class="text-[9px] text-slate-300 font-mono tracking-widest uppercase"
