<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KHO QR PRO v8.0 - FINAL STABLE</title>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <!-- UI & QR Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap');
        body { font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .qr-canvas canvas { display: inline-block !important; border: 4px solid white; border-radius: 12px; shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-active:active { transform: scale(0.95); transition: 0.1s; }
        #reader video { border-radius: 20px !important; object-fit: cover !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-blue-600 animate-pulse text-xs uppercase tracking-widest">Đang kết nối hệ thống...</p>
    </div>

    <!-- TRANG ĐĂNG NHẬP -->
    <div id="auth-page" class="hidden min-h-screen flex items-center justify-center p-6 bg-blue-700">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md">
            <h2 id="auth-title" class="text-3xl font-black text-center text-slate-800 mb-8 uppercase tracking-tighter">Đăng Nhập</h2>
            <div id="login-form" class="space-y-4">
                <input type="text" id="login-user" placeholder="SĐT hoặc 'Admin'" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-center border-none">
                <input type="password" id="login-pass" placeholder="Mật khẩu" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-center border-none">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-5 rounded-3xl font-black text-xl shadow-xl btn-active uppercase">VÀO APP</button>
                <button onclick="toggleAuth(true)" class="w-full text-blue-600 font-bold text-xs uppercase text-center mt-4 underline">Đăng ký nhân viên</button>
            </div>
            <div id="register-form" class="hidden space-y-4 text-center">
                <input type="text" id="reg-name" placeholder="Tên nhân viên" class="w-full p-4 bg-slate-100 rounded-3xl border-none outline-none font-bold">
                <input type="text" id="reg-phone" placeholder="Số điện thoại" class="w-full p-4 bg-slate-100 rounded-3xl border-none outline-none font-bold">
                <input type="password" id="reg-pass" placeholder="Mật khẩu tự chọn" class="w-full p-4 bg-slate-100 rounded-3xl border-none outline-none font-bold">
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white p-5 rounded-3xl font-black text-xl btn-active uppercase shadow-lg">Tạo tài khoản</button>
                <button onclick="toggleAuth(false)" class="w-full text-slate-500 font-bold text-xs uppercase mt-2">Quay lại</button>
            </div>
        </div>
    </div>

    <!-- TRANG ADMIN -->
    <div id="admin-page" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <span class="font-black text-blue-600 uppercase tracking-tighter italic font-bold">Admin Quản Lý Kho</span>
            <button onclick="logout()" class="text-red-500 font-bold text-[10px] uppercase border border-red-100 px-3 py-1 rounded-lg">Thoát</button>
        </nav>
        <main class="p-4 max-w-7xl mx-auto space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- Nhập hàng -->
                <div class="lg:col-span-4 space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <h3 class="font-black text-blue-600 mb-6 text-xs uppercase tracking-widest text-center italic">Nhập hàng hóa mới</h3>
                        <div class="space-y-4">
                            <input type="text" id="p-name" placeholder="Tên hàng hóa" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-none">
                            <input type="number" id="p-stock" placeholder="Số lượng" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-none">
                            <button onclick="adminAddProduct()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black btn-active uppercase shadow-lg">Lưu Kho</button>
                        </div>
                    </div>
                    <!-- Danh sách nhân viên -->
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden text-center">
                        <div class="p-4 bg-slate-800 text-white font-black text-[10px] uppercase tracking-widest italic font-bold">Mật khẩu nhân viên</div>
                        <div class="max-h-64 overflow-y-auto custom-scroll text-center">
                            <table class="w-full text-left text-xs">
                                <tbody id="admin-staff-list" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Lịch sử xuất kho (Admin) -->
                <div class="lg:col-span-8 bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400 text-center tracking-widest font-bold">Nhật ký lấy hàng (Đã sửa Undefined)</div>
                    <div class="max-h-[500px] overflow-y-auto custom-scroll text-sm">
                        <table class="w-full text-left">
                            <thead class="bg-slate-100/50 text-[10px] uppercase font-black">
                                <tr><th class="p-4">Thời gian</th><th class="p-4">Nhân viên</th><th class="p-4">Sản phẩm</th><th class="p-4 text-center">SL</th></tr>
                            </thead>
                            <tbody id="admin-history-list" class="divide-y divide-slate-100 italic"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- Quản lý tồn kho thực tế -->
            <div class="bg-white rounded-[3rem] shadow-xl border border-slate-200 overflow-hidden">
                <div class="p-5 bg-blue-600 text-white font-black text-[10px] uppercase text-center italic tracking-widest font-bold">Quản lý kho thực tế</div>
                <div class="overflow-x-auto text-sm text-center"><table class="w-full text-left"><tbody id="admin-inventory-list" class="divide-y divide-slate-100"></tbody></table></div>
            </div>
        </main>
    </div>

    <!-- TRANG NHÂN VIÊN -->
    <div id="staff-page" class="hidden min-h-screen bg-slate-50">
        <nav class="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-50">
            <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Nhân viên</p><p id="staff-display-name" class="font-black text-blue-600 text-lg"></p></div>
            <button onclick="logout()" class="text-slate-300 font-bold text-xs uppercase underline">Thoát</button>
        </nav>
        <div class="p-4 max-w-md mx-auto space-y-6">
            <button onclick="openScanner()" class="w-full bg-blue-600 text-white p-10 rounded-[3rem] font-black text-2xl shadow-2xl flex flex-col items-center justify-center gap-2 btn-active border-b-8 border-blue-800">QUÉT MÃ LẤY HÀNG</button>
            <div class="bg-white rounded-[2.5rem] shadow-xl border border-blue-200 overflow-hidden">
                <div class="p-4 bg-blue-50 border-b font-black text-[10px] uppercase text-blue-400 text-center tracking-widest italic font-bold">Lịch sử của tôi</div>
                <div id="staff-history-list" class="max-h-48 overflow-y-auto custom-scroll divide-y divide-slate-50"></div>
            </div>
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400 text-center tracking-widest italic">Danh sách xem hàng</div>
                <div id="staff-inventory-list" class="divide-y divide-slate-100"></div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="withdraw-modal" class="fixed inset-0 bg-black/80 z-[110] hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl text-center">
            <h2 id="w-product-name" class="text-2xl font-black text-slate-800 mb-1 italic uppercase font-bold">...</h2>
            <p id="w-product-stock" class="text-slate-400 font-bold text-sm mb-6 uppercase">Tồn kho: 0</p>
            <div class="space-y-4">
                <input type="number" id="w-quantity" placeholder="Số lượng" class="w-full text-center text-4xl font-black p-5 bg-slate-100 rounded-3xl border-none outline-none focus:ring-4 focus:ring-blue-100 transition-all">
                <button onclick="confirmWithdraw()" class="w-full bg-blue-600 text-white p-5 rounded-3xl font-black text-lg btn-active uppercase shadow-lg">Xác nhận lấy hàng</button>
                <button onclick="closeWithdraw()" class="text-slate-400 font-bold text-xs uppercase mt-2 block w-full">Hủy bỏ</button>
            </div>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden flex flex-col items-center justify-center p-8">
        <div id="reader" class="w-full max-w-sm rounded-[3rem] overflow-hidden border-4 border-white shadow-2xl"></div>
        <button onclick="closeScanner()" class="mt-8 bg-white/20 text-white px-10 py-4 rounded-full font-black uppercase text-xs btn-active backdrop-blur-md">Đóng máy quét</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDc-VCCLr_IeQIH42OYsyLjOaQq5YgJ5DE",
            authDomain: "khoqr-d67fd.firebaseapp.com",
            databaseURL: "https://khoqr-d67fd-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "khoqr-d67fd",
            storageBucket: "khoqr-d67fd.firebasestorage.app",
            messagingSenderId: "100113337906",
            appId: "1:100113337906:web:83b8cfc0b2d3679b8e362b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let currentUser = JSON.parse(localStorage.getItem('kho_session_v8'));
        let currentScanId = null;
        let scanner = null;

        function hideLoader() { const l = document.getElementById('loader'); if(l) { l.style.opacity = '0'; setTimeout(() => { l.classList.add('hidden'); if(!currentUser) document.getElementById('auth-page').classList.remove('hidden'); else renderUI(); }, 500); } }
        window.onload = () => { setTimeout(hideLoader, 3000); auth.signInAnonymously().then(hideLoader).catch(hideLoader); };

        function renderUI() {
            document.getElementById('auth-page').classList.add('hidden');
            if(currentUser.role === 'admin') { document.getElementById('admin-page').classList.remove('hidden'); initAdmin(); } 
            else { document.getElementById('staff-page').classList.remove('hidden'); document.getElementById('staff-display-name').innerText = currentUser.name; initStaff(); }
        }

        function toggleAuth(reg) {
            document.getElementById('login-form').classList.toggle('hidden', reg);
            document.getElementById('register-form').classList.toggle('hidden', !reg);
            document.getElementById('auth-title').innerText = reg ? 'ĐĂNG KÝ' : 'ĐĂNG NHẬP';
        }

        function handleRegister() {
            const n = document.getElementById('reg-name').value.trim();
            const ph = document.getElementById('reg-phone').value.trim();
            const pa = document.getElementById('reg-pass').value.trim();
            if(n && ph && pa) db.ref('users/' + ph).set({ name: n, phone: ph, pass: pa, role: 'staff' }, (e) => { if(!e) { alert("Đăng ký thành công!"); toggleAuth(false); } });
        }

        function handleLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === 'Admin' && p === '3032002') saveSession({ name: 'Chủ Kho', phone: 'admin', role: 'admin' });
            else db.ref('users/' + u).once('value', (s) => { const user = s.val(); if(user && user.pass === p) saveSession(user); else alert("Sai tài khoản!"); });
        }

        function saveSession(u) { localStorage.setItem('kho_session_v8', JSON.stringify(u)); location.reload(); }
        function logout() { localStorage.removeItem('kho_session_v8'); location.reload(); }

        // --- ADMIN ---
        function initAdmin() {
            // Lấy Kho
            db.ref('inventory').on('value', (s) => {
                const data = s.val() || {};
                const list = document.getElementById('admin-inventory-list');
                list.innerHTML = "";
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="border-b border-slate-50 transition hover:bg-slate-50">
                            <td class="p-6"><div id="qr-${id}" class="qr-canvas" onclick="printQR('${id}', '${item.name}')"></div></td>
                            <td class="p-6 font-black text-slate-700 italic uppercase text-center">${item.name}<br><span class="text-[9px] text-slate-300 font-mono tracking-widest uppercase">${id}</span></td>
                            <td class="p-6 text-center text-4xl font-black text-blue-600 tracking-tighter">${item.stock}</td>
                            <td class="p-6 text-right space-y-2">
                                <button onclick="adminEditProduct('${id}', '${item.name}', ${item.stock})" class="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold text-[10px] uppercase block ml-auto shadow-sm shadow-blue-200 uppercase font-bold italic shadow-md">Sửa</button>
                                <button onclick="adminDeleteItem('${id}')" class="bg-red-500 text-white px-3 py-1 rounded-lg font-bold text-[10px] uppercase block ml-auto mt-1 shadow-sm shadow-red-100 uppercase shadow-md">Xóa</button>
                            </td>
                        </tr>
                    `);
                    new QRCode(document.getElementById(`qr-${id}`), { text: id, width: 80, height: 80 });
                });
            });

            // Lấy danh sách nhân viên
            db.ref('users').on('value', (s) => {
                const users = s.val() || {};
                const list = document.getElementById('admin-staff-list');
                list.innerHTML = "";
                Object.keys(users).forEach(ph => {
                    const u = users[ph];
                    if(u.role === 'staff') {
                        list.insertAdjacentHTML('beforeend', `
                            <tr class="border-b border-slate-50 text-[11px]">
                                <td class="p-3 font-bold text-slate-700 uppercase italic font-bold">${u.name}</td>
                                <td class="p-3 text-slate-400 font-mono text-center">${u.phone}</td>
                                <td class="p-3 text-blue-600 font-black text-center tracking-widest italic">${u.pass}</td>
                                <td class="p-3 text-right"><button onclick="adminDeleteUser('${ph}')" class="text-red-200 font-bold text-lg">✕</button></td>
                            </tr>
                        `);
                    }
                }
            });

            // Lấy Nhật ký - SỬA LỖI UNDEFINED
            db.ref('logs').on('value', (s) => {
                const logs = s.val() || {};
                const list = document.getElementById('admin-history-list');
                list.innerHTML = "";
                const sortedKeys = Object.keys(logs).reverse();
                sortedKeys.forEach(key => {
                    const l = logs[key];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="border-b border-slate-50">
                            <td class="p-4 text-slate-400 font-mono text-[10px] italic">${formatDate(l.time)}</td>
                            <td class="p-4 font-bold text-slate-700 uppercase italic font-bold">${l.staffName || 'Admin'}</td>
                            <td class="p-4 italic text-blue-600 font-bold uppercase">${l.prodName || 'Sản phẩm'}</td>
                            <td class="p-4 text-center font-black text-slate-900 text-lg">${l.qty}</td>
                        </tr>
                    `);
                });
            });
        }

        function adminAddProduct() {
            const n = document.getElementById('p-name').value.trim();
            const s = parseInt(document.getElementById('p-stock').value);
            if(!n || isNaN(s)) return alert("Nhập đủ tên và SL!");
            const id = "SP" + Date.now().toString().slice(-6);
            db.ref('inventory/' + id).set({ name: n, stock: s }, (e) => { if(!e) { document.getElementById('p-name').value = ""; document.getElementById('p-stock').value = ""; } });
        }

        // --- CHỨC NĂNG SỬA TÊN VÀ SỐ LƯỢNG (DÀNH CHO ADMIN) ---
        function adminEditProduct(id, currentName, currentStock) {
            const newName = prompt("Nhập TÊN MỚI cho sản phẩm:", currentName);
            if (newName === null) return; // Nếu bấm Huỷ

            const newStock = prompt("Nhập SỐ LƯỢNG MỚI (Ví dụ: sửa từ " + currentStock + " thành bao nhiêu?):", currentStock);
            if (newStock === null) return; // Nếu bấm Huỷ

            db.ref('inventory/' + id).update({
                name: newName,
                stock: parseInt(newStock)
            }, (err) => {
                if(!err) alert("✅ Đã cập nhật thành công!");
                else alert("Lỗi khi cập nhật!");
            });
        }

        function adminDeleteItem(id) { if(confirm("Xóa sản phẩm này?")) db.ref('inventory/' + id).remove(); }
        function adminDeleteUser(ph) { if(confirm("Xóa nhân viên này?")) db.ref('users/' + ph).remove(); }

        // --- NHÂN VIÊN ---
        function initStaff() {
            db.ref('inventory').on('value', (s) => {
                const data = s.val() || {};
                const list = document.getElementById('staff-inventory-list');
                list.innerHTML = "";
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <div class="p-6 flex justify-between items-center bg-white border-b border-slate-50">
                            <div><p class="font-black text-slate-700 italic uppercase font-bold underline decoration-blue-100 decoration-4">${item.name}</p><p class="text-[9px] text-slate-300 font-mono uppercase">${id}</p></div>
                            <div class="text-right"><p class="text-[9px] font-black text-slate-300 uppercase italic text-center">Tồn kho</p><p class="text-3xl font-black ${item.stock > 0 ? 'text-blue-600' : 'text-red-400'} tracking-tighter">${item.stock}</p></div>
                        </div>
                    `);
                });
            });

            db.ref('logs').on('value', (s) => {
                const logs = s.val() || {};
                const list = document.getElementById('staff-history-list');
                list.innerHTML = "";
                const sortedKeys = Object.keys(logs).reverse();
                sortedKeys.forEach(key => {
                    const l = logs[key];
                    if(l.staffPhone === currentUser.phone) {
                        list.insertAdjacentHTML('beforeend', `
                            <div class="p-4 flex justify-between items-center">
                                <div><p class="text-[10px] text-slate-400 font-mono">${formatDate(l.time)}</p><p class="font-bold text-slate-700 italic text-sm uppercase">Lấy: ${l.prodName}</p></div>
                                <div class="bg-blue-600 text-white px-3 py-1 rounded-full font-black shadow-sm shadow-blue-100">-${l.qty}</div>
                            </div>
                        `);
                    }
                });
            });
        }

        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            if(!scanner) scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                closeScanner();
                showWithdrawModal(text);
            }).catch(e => alert("Lỗi camera!"));
        }

        function closeScanner() { if(scanner) scanner.stop(); document.getElementById('scanner-modal').classList.add('hidden'); }

        function showWithdrawModal(pid) {
            currentScanId = pid;
            db.ref('inventory/' + pid).once('value', (s) => {
                const item = s.val();
                if(!item) return alert("Mã sai!");
                document.getElementById('w-product-name').innerText = item.name;
                document.getElementById('w-product-stock').innerText = "Trong kho còn: " + item.stock;
                document.getElementById('withdraw-modal').classList.remove('hidden');
            });
        }

        function closeWithdraw() { document.getElementById('withdraw-modal').classList.add('hidden'); }

        function confirmWithdraw() {
            const qty = parseInt(document.getElementById('w-quantity').value);
            if(!qty || qty <= 0) return alert("Nhập số lượng!");

            db.ref('inventory/' + currentScanId).once('value', (s) => {
                const item = s.val();
                if(!item || qty > item.stock) return alert("Lỗi hàng hóa!");

                db.ref('inventory/' + currentScanId + '/stock').set(item.stock - qty, (e) => {
                    if(!e) {
                        db.ref('logs').push({
                            staffName: currentUser.name,
                            staffPhone: currentUser.phone,
                            prodName: item.name,
                            qty: qty,
                            time: Date.now()
                        });
                        alert("✅ Lấy hàng thành công!");
                        closeWithdraw();
                        document.getElementById('w-quantity').value = "";
                    }
                });
            });
        }

        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return (d.getHours() < 10 ? '0' : '') + d.getHours() + ":" + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() + " - " + d.getDate() + "/" + (d.getMonth() + 1);
        }

        function printQR(id, name) {
            const win = window.open('', '_blank');
            win.document.write(`<html><body style="text-align:center;padding-top:100px;font-family:sans-serif"><h1>SẢN PHẨM: ${name}</h1><h3>ID: ${id}</h3><div id="q" style="display:inline-block"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById("q"), {text:"${id}", width:350, height:350}); setTimeout(()=>window.print(), 500);<\/script></body></html>`);
            win.document.close();
        }
    </script>
</body>
</html>
