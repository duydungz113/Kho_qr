<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Kho QR Cloud v4.0 - Final</title>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <!-- UI & QR Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap');
        body { font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .hidden { display: none !important; }
        .qr-canvas canvas { display: inline-block !important; border: 5px solid white; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .btn-active:active { transform: scale(0.95); transition: 0.1s; }
        #reader video { border-radius: 30px !important; object-fit: cover !important; }
        #loader { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.6s; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- MÀN HÌNH CHỜ (Tự động biến mất sau 3 giây) -->
    <div id="loader">
        <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-black text-blue-600 animate-pulse uppercase text-[10px] tracking-[0.2em]">Hệ thống đang kết nối...</p>
    </div>

    <!-- TRANG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-page" class="hidden min-h-screen flex items-center justify-center p-4 bg-blue-600 bg-opacity-95">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md border-b-8 border-blue-800">
            <h2 id="auth-title" class="text-4xl font-black text-center text-slate-800 mb-10 uppercase tracking-tighter">Đăng Nhập</h2>
            
            <div id="login-form" class="space-y-5">
                <input type="text" id="login-user" placeholder="SĐT hoặc 'Admin'" class="w-full p-5 bg-slate-100 rounded-3xl outline-none focus:ring-4 focus:ring-blue-100 font-bold transition-all text-center">
                <input type="password" id="login-pass" placeholder="Mật khẩu" class="w-full p-5 bg-slate-100 rounded-3xl outline-none focus:ring-4 focus:ring-blue-100 font-bold transition-all text-center">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-5 rounded-3xl font-black text-xl shadow-xl btn-active uppercase mt-4">Vào Hệ Thống</button>
                <button onclick="toggleAuth(true)" class="w-full text-blue-600 font-bold text-sm text-center">Chưa có tài khoản? Đăng ký nhân viên</button>
            </div>

            <div id="register-form" class="hidden space-y-5">
                <input type="text" id="reg-name" placeholder="Họ tên nhân viên" class="w-full p-5 bg-slate-100 rounded-3xl outline-none focus:ring-4 focus:ring-green-100 font-bold text-center">
                <input type="text" id="reg-phone" placeholder="Số điện thoại" class="w-full p-5 bg-slate-100 rounded-3xl outline-none focus:ring-4 focus:ring-green-100 font-bold text-center">
                <input type="password" id="reg-pass" placeholder="Mật khẩu tự chọn" class="w-full p-5 bg-slate-100 rounded-3xl outline-none focus:ring-4 focus:ring-green-100 font-bold text-center">
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white p-5 rounded-3xl font-black text-xl shadow-xl btn-active uppercase">Tạo Tài Khoản</button>
                <button onclick="toggleAuth(false)" class="w-full text-slate-400 font-bold text-sm text-center block">Quay lại Đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- TRANG CHỦ ADMIN -->
    <div id="admin-page" class="hidden">
        <nav class="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-black text-2xl italic shadow-blue-200 shadow-lg">K</div>
                <span class="font-black text-slate-800 uppercase tracking-widest text-lg">Quản Lý Kho</span>
            </div>
            <button onclick="logout()" class="bg-red-50 text-red-500 px-5 py-2 rounded-2xl font-black text-[10px] uppercase border border-red-100 shadow-sm">Thoát</button>
        </nav>

        <main class="p-4 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Cột trái: Nhập hàng -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <h3 class="font-black text-blue-600 mb-8 text-[11px] uppercase tracking-[0.3em]">Nhập hàng mới</h3>
                    <div class="space-y-4">
                        <input type="text" id="p-name" placeholder="Tên sản phẩm" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                        <input type="text" id="p-id" placeholder="Mã QR định danh" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 uppercase font-bold">
                        <input type="number" id="p-stock" placeholder="Số lượng" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                        <button onclick="adminAddProduct()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black shadow-lg btn-active uppercase text-sm tracking-widest">Lưu Database</button>
                    </div>
                </div>

                <!-- Bảng mật khẩu nhân viên -->
                <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-800 text-white font-black text-[10px] uppercase tracking-widest text-center">Danh sách nhân viên & Mật khẩu</div>
                    <div class="max-h-64 overflow-y-auto custom-scroll">
                        <table class="w-full text-left text-xs">
                            <tbody id="admin-staff-list" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Bảng kho -->
            <div class="lg:col-span-8 bg-white rounded-[3rem] shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 bg-slate-50 border-b flex justify-between items-center font-black text-[10px] uppercase text-slate-400 tracking-widest">
                    <span>Hàng tồn kho thực tế</span>
                    <span id="total-items" class="bg-blue-600 text-white px-3 py-1 rounded-full italic font-bold">0 SP</span>
                </div>
                <div class="overflow-x-auto text-sm">
                    <table class="w-full text-left border-collapse">
                        <thead class="text-[10px] text-slate-400 font-black uppercase border-b bg-slate-50">
                            <tr><th class="p-6">Mã QR</th><th class="p-6">Sản phẩm</th><th class="p-6 text-center">Tồn</th><th class="p-6 text-right">Quản lý</th></tr>
                        </thead>
                        <tbody id="admin-inventory-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- TRANG CHỦ NHÂN VIÊN -->
    <div id="staff-page" class="hidden min-h-screen bg-slate-100">
        <nav class="bg-white border-b p-6 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Nhân viên kho</p>
                <p id="staff-display-name" class="font-black text-blue-600 text-xl italic"></p>
            </div>
            <button onclick="logout()" class="text-slate-300 font-black text-[10px] uppercase underline">Thoát</button>
        </nav>

        <div class="p-4 max-w-md mx-auto space-y-8">
            <button onclick="openScanner()" class="w-full bg-blue-600 text-white p-10 rounded-[3rem] font-black text-2xl shadow-2xl flex flex-col items-center justify-center gap-2 btn-active border-b-[12px] border-blue-800 mt-4">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                QUÉT MÃ QR
            </button>

            <div class="bg-white rounded-[3rem] shadow-xl border border-slate-200 overflow-hidden">
                <div class="p-6 bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400 text-center tracking-[0.3em]">Danh mục tồn kho thực tế</div>
                <div id="staff-inventory-list" class="divide-y divide-slate-50 max-h-[50vh] overflow-y-auto custom-scroll"></div>
            </div>
        </div>
    </div>

    <!-- SCANNER MODAL -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden flex flex-col items-center justify-center p-8">
        <div id="reader" class="w-full max-w-sm rounded-[3rem] overflow-hidden border-8 border-white shadow-2xl"></div>
        <button onclick="closeScanner()" class="mt-12 bg-white text-black px-12 py-5 rounded-full font-black uppercase text-xs tracking-widest btn-active shadow-2xl">Đóng Máy Quét</button>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-10 right-6 w-80 space-y-4 z-[9999] pointer-events-none"></div>

    <script>
        // CẤU HÌNH FIREBASE CỦA BẠN
        const firebaseConfig = {
            apiKey: "AIzaSyDc-VCCLr_IeQIH42OYsyLjOaQq5YgJ5DE",
            authDomain: "khoqr-d67fd.firebaseapp.com",
            databaseURL: "https://khoqr-d67fd-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "khoqr-d67fd",
            storageBucket: "khoqr-d67fd.firebasestorage.app",
            messagingSenderId: "100113337906",
            appId: "1:100113337906:web:83b8cfc0b2d3679b8e362b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let currentUser = JSON.parse(localStorage.getItem('kho_session_v4'));
        let scanner = null;

        // TỰ ĐỘNG PHÁ KHÓA SAU 3 GIÂY
        function hideLoader() {
            const loader = document.getElementById('loader');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => { 
                    loader.style.display = 'none'; 
                    if(!currentUser) document.getElementById('auth-page').classList.remove('hidden');
                    else renderUI();
                }, 600);
            }
        }

        window.onload = () => {
            setTimeout(hideLoader, 3000); 
            auth.signInAnonymously().then(() => {
                console.log("Database Connected Successfully!");
                hideLoader();
            }).catch(err => {
                console.warn("Bypass Security Layer...");
                hideLoader();
            });
        };

        function renderUI() {
            document.getElementById('auth-page').classList.add('hidden');
            if(currentUser.role === 'admin') {
                document.getElementById('admin-page').classList.remove('hidden');
                initAdmin();
            } else {
                document.getElementById('staff-page').classList.remove('hidden');
                document.getElementById('staff-display-name').innerText = currentUser.name;
                initStaff();
            }
        }

        function toggleAuth(isReg) {
            document.getElementById('login-form').classList.toggle('hidden', isReg);
            document.getElementById('register-form').classList.toggle('hidden', !isReg);
            document.getElementById('auth-title').innerText = isReg ? 'Đăng Ký' : 'Đăng Nhập';
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            if(!name || !phone || !pass) return alert("Vui lòng điền đủ 3 ô thông tin!");
            db.ref('users/' + phone).set({ name, phone, pass, role: 'staff' }, (err) => {
                if(!err) {
                    alert("✅ ĐĂNG KÝ THÀNH CÔNG! Chúc mừng bạn đã có tài khoản.");
                    document.getElementById('reg-name').value = ""; document.getElementById('reg-phone').value = ""; document.getElementById('reg-pass').value = "";
                    toggleAuth(false);
                } else alert("❌ LỖI DATABASE: Hãy kiểm tra nút Anonymous trên Firebase!");
            });
        }

        function handleLogin() {
            const userIn = document.getElementById('login-user').value.trim();
            const passIn = document.getElementById('login-pass').value.trim();
            if(userIn === 'Admin' && passIn === '3032002') {
                saveSession({ name: 'Chủ Kho', role: 'admin' });
            } else {
                db.ref('users/' + userIn).once('value', (s) => {
                    const u = s.val();
                    if(u && u.pass === passIn) saveSession(u);
                    else alert("Sai tài khoản hoặc mật khẩu!");
                });
            }
        }

        function saveSession(u) {
            localStorage.setItem('kho_session_v4', JSON.stringify(u));
            location.reload();
        }

        function logout() { localStorage.removeItem('kho_session_v4'); location.reload(); }

        function initAdmin() {
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('admin-inventory-list');
                list.innerHTML = "";
                let count = 0;
                for(let id in data) {
                    count++;
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-slate-50 transition border-b border-slate-50">
                            <td class="p-6"><div id="qr-${id}" class="qr-canvas" onclick="printQR('${id}')"></div></td>
                            <td class="p-6"><b class="text-slate-800 text-lg block italic uppercase font-bold">${item.name}</b><span class="text-[10px] text-slate-300 font-mono tracking-widest uppercase">${id}</span></td>
                            <td class="p-6 text-center text-4xl font-black text-blue-600 tracking-tighter">${item.stock}</td>
                            <td class="p-6 text-right space-y-2">
                                <button onclick="adminEditStock('${id}')" class="text-blue-500 font-black text-[10px] uppercase block ml-auto underline tracking-widest">Sửa kho</button>
                                <button onclick="adminDeleteItem('${id}')" class="text-red-300 font-black text-[10px] uppercase block ml-auto">Xóa</button>
                            </td>
                        </tr>
                    `);
                    new QRCode(document.getElementById(`qr-${id}`), { text: id, width: 80, height: 80 });
                }
                document.getElementById('total-items').innerText = `${count} SP`;
            });
            db.ref('users').on('value', (s) => {
                const users = s.val();
                const list = document.getElementById('admin-staff-list');
                list.innerHTML = "";
                for(let phone in users) {
                    const u = users[phone];
                    if(u.role === 'staff') {
                        list.insertAdjacentHTML('beforeend', `
                            <tr class="border-b border-slate-50">
                                <td class="p-4 font-bold text-slate-700">${u.name}</td>
                                <td class="p-4 text-slate-400 font-mono text-center">${u.phone}</td>
                                <td class="p-4 text-blue-600 font-black text-center tracking-[0.2em]">${u.pass}</td>
                                <td class="p-4 text-right"><button onclick="adminDeleteUser('${phone}')" class="text-red-200 font-bold text-lg">✕</button></td>
                            </tr>
                        `);
                    }
                }
            });
            db.ref('logs').limitToLast(1).on('child_added', (s) => {
                const log = s.val();
                if(Date.now() - log.time < 5000) showAdminToast(log.staff, log.prod, log.qty);
            });
        }

        function adminAddProduct() {
            const name = document.getElementById('p-name').value.trim();
            const id = document.getElementById('p-id').value.toUpperCase().trim();
            const stock = parseInt(document.getElementById('p-stock').value);
            if(name && id && !isNaN(stock)) db.ref('inventory/' + id).set({ name, stock }, (err) => {
                if(!err) {
                    alert("Đã lưu hàng mới!");
                    document.getElementById('p-name').value = ""; document.getElementById('p-id').value = ""; document.getElementById('p-stock').value = "";
                }
            });
        }

        function adminEditStock(id) {
            const n = prompt("Số lượng thực tế mới đang có trong kho:");
            if(n !== null) db.ref('inventory/' + id + '/stock').set(parseInt(n));
        }

        function adminDeleteItem(id) { if(confirm("Xóa sản phẩm này?")) db.ref('inventory/' + id).remove(); }
        function adminDeleteUser(phone) { if(confirm("Xóa nhân viên?")) db.ref('users/' + phone).remove(); }

        function printQR(id) {
            const win = window.open('', '_blank');
            win.document.write(`<html><body style="text-align:center;padding-top:100px;font-family:sans-serif"><h1>QR SẢN PHẨM: ${id}</h1><div id="q" style="display:inline-block"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById("q"), {text:"${id}", width:350, height:350}); setTimeout(()=>window.print(), 500);<\/script></body></html>`);
            win.document.close();
        }

        function initStaff() {
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('staff-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <div class="p-6 flex justify-between items-center bg-white border-b border-slate-50">
                            <div><p class="font-black text-slate-700 uppercase italic underline decoration-blue-200 decoration-4">${item.name}</p><p class="text-[9px] text-slate-300 font-mono tracking-widest uppercase">${id}</p></div>
                            <div class="text-right"><p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Tồn thực tế</p><p class="text-3xl font-black ${item.stock > 0 ? 'text-blue-600' : 'text-red-400'} tracking-tighter">${item.stock}</p></div>
                        </div>
                    `);
                }
            });
        }

        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            if(!scanner) scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => {
                closeScanner();
                db.ref('inventory/' + text).once('value', (s) => {
                    const item = s.val();
                    if(!item) return alert("Mã QR này không tồn tại trong kho!");
                    const qtyStr = prompt(`XUẤT KHO: ${item.name}\nTồn: ${item.stock}\nBạn lấy bao nhiêu cái?`, "1");
                    const qty = parseInt(qtyStr);
                    if(qty > 0 && item.stock >= qty) {
                        db.ref('inventory/' + text + '/stock').set(item.stock - qty, (err) => {
                            if(!err) {
                                db.ref('logs').push({ staff: currentUser.name, prod: item.name, qty: qty, time: Date.now() });
                                alert("XUẤT KHO THÀNH CÔNG!");
                            }
                        });
                    } else alert("Số lượng sai hoặc kho không đủ hàng!");
                });
            }).catch(err => alert("Vui lòng cho phép Camera!"));
        }

        function closeScanner() {
            if(scanner) scanner.stop();
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        function showAdminToast(staff, prod, qty) {
            const container = document.getElementById('toast-container');
            const id = Date.now();
            const toast = `<div id="toast-${id}" class="bg-blue-900 text-white p-6 rounded-[2rem] shadow-2xl border-l-[12px] border-blue-400 animate-bounce transition-all"><p class="text-[10px] font-black text-blue-300 uppercase italic tracking-widest mb-1">Cập nhật kho:</p><p class="text-sm"><b>${staff}</b> vừa lấy <b>${qty} cái ${prod}</b></p></div>`;
            container.insertAdjacentHTML('afterbegin', toast);
            setTimeout(() => { document.getElementById(`toast-${id}`)?.remove(); }, 12000);
        }
    </script>
</body>
</html>
