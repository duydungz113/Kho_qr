<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KHO QR PRO v6.0 - LỊCH SỬ</title>
    
    <!-- Firebase & Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap');
        body { font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
        .hidden { display: none !important; }
        .btn-active:active { transform: scale(0.95); transition: 0.1s; }
        .qr-canvas canvas { display: inline-block !important; border: 4px solid white; border-radius: 12px; shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #reader video { border-radius: 30px !important; object-fit: cover !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- LOADER -->
    <div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-blue-600 animate-pulse text-xs uppercase tracking-widest">Đang đồng bộ lịch sử...</p>
    </div>

    <!-- TRANG ĐĂNG NHẬP -->
    <div id="auth-page" class="hidden min-h-screen flex items-center justify-center p-6 bg-blue-700">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md">
            <h2 id="auth-title" class="text-3xl font-black text-center text-slate-800 mb-8 uppercase tracking-tighter">Đăng Nhập</h2>
            <div id="login-form" class="space-y-4">
                <input type="text" id="login-user" placeholder="SĐT hoặc 'Admin'" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-center border-none">
                <input type="password" id="login-pass" placeholder="Mật khẩu" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-center border-none">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-5 rounded-3xl font-black text-xl shadow-xl btn-active uppercase">VÀO APP</button>
                <button onclick="toggleAuth(true)" class="w-full text-blue-600 font-bold text-xs uppercase text-center mt-4 underline">Đăng ký nhân viên</button>
            </div>
            <div id="register-form" class="hidden space-y-4">
                <input type="text" id="reg-name" placeholder="Tên nhân viên" class="w-full p-4 bg-slate-100 rounded-3xl border-none outline-none font-bold">
                <input type="text" id="reg-phone" placeholder="Số điện thoại" class="w-full p-4 bg-slate-100 rounded-3xl border-none outline-none font-bold">
                <input type="password" id="reg-pass" placeholder="Mật khẩu tự chọn" class="w-full p-4 bg-slate-100 rounded-3xl border-none outline-none font-bold">
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white p-5 rounded-3xl font-black text-xl btn-active uppercase">Tạo tài khoản</button>
                <button onclick="toggleAuth(false)" class="w-full text-slate-500 font-bold text-xs uppercase mt-2">Quay lại</button>
            </div>
        </div>
    </div>

    <!-- TRANG ADMIN -->
    <div id="admin-page" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <span class="font-black text-blue-600 uppercase tracking-tighter italic">Admin Tổng Kho</span>
            <button onclick="logout()" class="text-red-500 font-bold text-[10px] uppercase border border-red-100 px-3 py-1 rounded-lg">Thoát</button>
        </nav>
        <main class="p-4 max-w-7xl mx-auto space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- Nhập hàng -->
                <div class="lg:col-span-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-black text-blue-600 mb-6 text-xs uppercase tracking-widest italic">Nhập hàng mới</h3>
                    <div class="space-y-4">
                        <input type="text" id="p-name" placeholder="Tên hàng hóa" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold">
                        <input type="number" id="p-stock" placeholder="Số lượng" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold">
                        <button onclick="adminAddProduct()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black btn-active uppercase shadow-lg">Lưu Kho</button>
                    </div>
                </div>
                <!-- Toàn bộ lịch sử lấy hàng (Cho Admin) -->
                <div class="lg:col-span-8 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-800 text-white font-black text-[10px] uppercase text-center tracking-widest italic">Toàn bộ lịch sử lấy hàng</div>
                    <div class="max-h-60 overflow-y-auto custom-scroll">
                        <table class="w-full text-left text-[11px]">
                            <thead class="bg-slate-50 border-b">
                                <tr><th class="p-3">Thời gian</th><th class="p-3">Nhân viên</th><th class="p-3">Sản phẩm</th><th class="p-3 text-center">SL</th></tr>
                            </thead>
                            <tbody id="admin-history-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- Bảng tồn kho Admin -->
            <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden">
                <div class="p-5 bg-blue-600 text-white font-black text-[10px] uppercase text-center italic">Quản lý tồn kho</div>
                <div class="overflow-x-auto text-sm"><table class="w-full text-left"><tbody id="admin-inventory-list" class="divide-y divide-slate-100"></tbody></table></div>
            </div>
        </main>
    </div>

    <!-- TRANG NHÂN VIÊN -->
    <div id="staff-page" class="hidden min-h-screen">
        <nav class="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-50">
            <div><p class="text-[10px] font-black text-slate-400 uppercase">Nhân viên</p><p id="staff-display-name" class="font-black text-blue-600 text-lg"></p></div>
            <button onclick="logout()" class="text-slate-300 font-bold text-xs uppercase underline">Thoát</button>
        </nav>
        <div class="p-4 max-w-md mx-auto space-y-6">
            <button onclick="openScanner()" class="w-full bg-blue-600 text-white p-8 rounded-[2.5rem] font-black text-xl shadow-2xl flex flex-col items-center justify-center gap-2 btn-active border-b-8 border-blue-800">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                QUÉT MÃ LẤY HÀNG
            </button>

            <!-- LỊCH SỬ CỦA NHÂN VIÊN (Yêu cầu của bạn) -->
            <div class="bg-white rounded-[2rem] shadow-xl border border-blue-200 overflow-hidden">
                <div class="p-4 bg-blue-50 border-b font-black text-[10px] uppercase text-blue-400 text-center tracking-widest italic">Lịch sử lấy hàng của tôi</div>
                <div id="staff-history-list" class="max-h-48 overflow-y-auto custom-scroll divide-y divide-slate-50"></div>
            </div>

            <!-- DANH SÁCH HÀNG -->
            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400 text-center tracking-widest">Xem tồn kho hiện tại</div>
                <div id="staff-inventory-list" class="divide-y divide-slate-100"></div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="withdraw-modal" class="fixed inset-0 bg-black/80 z-[110] hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl text-center">
            <h2 id="w-product-name" class="text-2xl font-black text-slate-800 mb-1 italic">Tên sản phẩm</h2>
            <p id="w-product-stock" class="text-slate-400 font-bold text-sm mb-6">Tồn: 0</p>
            <div class="space-y-4">
                <input type="number" id="w-quantity" placeholder="Nhập số lượng" class="w-full text-center text-4xl font-black p-5 bg-slate-100 rounded-3xl border-none outline-none">
                <button onclick="confirmWithdraw()" class="w-full bg-blue-600 text-white p-5 rounded-3xl font-black text-lg btn-active">XÁC NHẬN LẤY</button>
                <button onclick="closeWithdraw()" class="text-slate-400 font-bold text-xs uppercase mt-2">Hủy bỏ</button>
            </div>
        </div>
    </div>

    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden flex flex-col items-center justify-center p-8">
        <div id="reader" class="w-full max-w-sm rounded-[3rem] overflow-hidden border-4 border-white"></div>
        <button onclick="closeScanner()" class="mt-8 bg-white/20 text-white px-10 py-4 rounded-full font-bold uppercase text-xs">Đóng máy quét</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDc-VCCLr_IeQIH42OYsyLjOaQq5YgJ5DE",
            authDomain: "khoqr-d67fd.firebaseapp.com",
            databaseURL: "https://khoqr-d67fd-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "khoqr-d67fd",
            storageBucket: "khoqr-d67fd.firebasestorage.app",
            messagingSenderId: "100113337906",
            appId: "1:100113337906:web:83b8cfc0b2d3679b8e362b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let currentUser = JSON.parse(localStorage.getItem('kho_session_v4'));
        let currentScanId = null;
        let scanner = null;

        function hideLoader() { const l = document.getElementById('loader'); if(l) { l.style.opacity = '0'; setTimeout(() => { l.classList.add('hidden'); if(!currentUser) document.getElementById('auth-page').classList.remove('hidden'); else renderUI(); }, 500); } }
        window.onload = () => { setTimeout(hideLoader, 3000); auth.signInAnonymously().then(hideLoader).catch(hideLoader); };

        function renderUI() {
            document.getElementById('auth-page').classList.add('hidden');
            if(currentUser.role === 'admin') { document.getElementById('admin-page').classList.remove('hidden'); initAdmin(); } 
            else { document.getElementById('staff-page').classList.remove('hidden'); document.getElementById('staff-display-name').innerText = currentUser.name; initStaff(); }
        }

        function toggleAuth(reg) {
            document.getElementById('login-form').classList.toggle('hidden', reg);
            document.getElementById('register-form').classList.toggle('hidden', !reg);
            document.getElementById('auth-title').innerText = reg ? 'ĐĂNG KÝ' : 'ĐĂNG NHẬP';
        }

        function handleRegister() {
            const n = document.getElementById('reg-name').value;
            const ph = document.getElementById('reg-phone').value;
            const pa = document.getElementById('reg-pass').value;
            if(n && ph && pa) db.ref('users/' + ph).set({ name: n, phone: ph, pass: pa, role: 'staff' }, (e) => { if(!e) { alert("Xong! Hãy đăng nhập."); toggleAuth(false); } });
        }

        function handleLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if(u === 'Admin' && p === '3032002') saveSession({ name: 'Chủ Kho', phone: 'admin', role: 'admin' });
            else db.ref('users/' + u).once('value', (s) => { const user = s.val(); if(user && user.pass === p) saveSession(user); else alert("Sai tài khoản!"); });
        }

        function saveSession(u) { localStorage.setItem('kho_session_v4', JSON.stringify(u)); location.reload(); }
        function logout() { localStorage.removeItem('kho_session_v4'); location.reload(); }

        // --- ADMIN ---
        function initAdmin() {
            // Lấy Kho
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('admin-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="border-b border-slate-50 transition hover:bg-slate-50">
                            <td class="p-6"><div id="qr-${id}" class="qr-canvas" onclick="printQR('${id}', '${item.name}')"></div></td>
                            <td class="p-6 font-black text-slate-700 italic uppercase text-center">${item.name}<br><span class="text-[9px] text-slate-300 font-mono tracking-widest uppercase">${id}</span></td>
                            <td class="p-6 text-center text-3xl font-black text-blue-600 tracking-tighter">${item.stock}</td>
                            <td class="p-6 text-right space-y-2">
                                <button onclick="adminEditProduct('${id}', '${item.name}', ${item.stock})" class="bg-blue-600 text-white px-3 py-1 rounded-lg font-bold text-[10px] uppercase block ml-auto">Sửa</button>
                                <button onclick="adminDeleteItem('${id}')" class="bg-red-500 text-white px-3 py-1 rounded-lg font-bold text-[10px] uppercase block ml-auto mt-1">Xóa</button>
                            </td>
                        </tr>
                    `);
                    new QRCode(document.getElementById(`qr-${id}`), { text: id, width: 70, height: 70 });
                }
            });

            // Lấy toàn bộ lịch sử (Logs)
            db.ref('logs').on('value', (s) => {
                const logs = s.val();
                const list = document.getElementById('admin-history-list');
                list.innerHTML = "";
                const sortedKeys = Object.keys(logs || {}).reverse();
                sortedKeys.forEach(key => {
                    const l = logs[key];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="border-b border-slate-50">
                            <td class="p-3 text-slate-400 font-mono">${formatDate(l.time)}</td>
                            <td class="p-3 font-bold text-slate-700">${l.staffName}</td>
                            <td class="p-3 italic text-blue-600">${l.prodName}</td>
                            <td class="p-3 text-center font-black text-slate-900">${l.qty}</td>
                        </tr>
                    `);
                });
            });
        }

        function adminAddProduct() {
            const n = document.getElementById('p-name').value.trim();
            const s = parseInt(document.getElementById('p-stock').value);
            if(!n || isNaN(s)) return alert("Nhập đủ Tên và Số lượng!");
            const id = "SP" + Date.now().toString().slice(-6);
            db.ref('inventory/' + id).set({ name: n, stock: s }, (e) => { if(!e) { document.getElementById('p-name').value = ""; document.getElementById('p-stock').value = ""; } });
        }

        function adminEditProduct(id, currentName, currentStock) {
            const newName = prompt("TÊN MỚI:", currentName);
            if (!newName) return;
            const newStock = prompt("SỐ LƯỢNG MỚI:", currentStock);
            if (newStock === null) return;
            db.ref('inventory/' + id).update({ name: newName, stock: parseInt(newStock) });
        }

        function adminDeleteItem(id) { if(confirm("Xóa?")) db.ref('inventory/' + id).remove(); }

        // --- NHÂN VIÊN ---
        function initStaff() {
            // Lấy Kho
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('staff-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <div class="p-6 flex justify-between items-center bg-white border-b border-slate-50">
                            <div><p class="font-black text-slate-700 italic uppercase font-bold underline decoration-blue-100 decoration-4">${item.name}</p><p class="text-[9px] text-slate-300 font-mono uppercase">${id}</p></div>
                            <div class="text-right"><p class="text-[9px] font-black text-slate-300 uppercase italic text-center">Tồn</p><p class="text-2xl font-black text-blue-600">${item.stock}</p></div>
                        </div>
                    `);
                }
            });

            // Lấy Lịch sử của tôi
            db.ref('logs').on('value', (s) => {
                const logs = s.val();
                const list = document.getElementById('staff-history-list');
                list.innerHTML = "";
                const sortedKeys = Object.keys(logs || {}).reverse();
                sortedKeys.forEach(key => {
                    const l = logs[key];
                    // CHỈ HIỆN LỊCH SỬ CỦA NGƯỜI ĐANG ĐĂNG NHẬP
                    if(l.staffPhone === currentUser.phone) {
                        list.insertAdjacentHTML('beforeend', `
                            <div class="p-4 flex justify-between items-center">
                                <div><p class="text-[10px] text-slate-400 font-mono">${formatDate(l.time)}</p><p class="font-bold text-slate-700 italic text-sm">Lấy ${l.prodName}</p></div>
                                <div class="bg-blue-600 text-white px-3 py-1 rounded-full font-black">-${l.qty}</div>
                            </div>
                        `);
                    }
                });
            });
        }

        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            if(!scanner) scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                closeScanner();
                showWithdrawModal(text);
            }).catch(e => alert("Lỗi camera!"));
        }

        function closeScanner() { if(scanner) scanner.stop(); document.getElementById('scanner-modal').classList.add('hidden'); }

        function showWithdrawModal(pid) {
            currentScanId = pid;
            db.ref('inventory/' + pid).once('value', (s) => {
                const item = s.val();
                if(!item) return alert("Sai mã!");
                document.getElementById('w-product-name').innerText = item.name;
                document.getElementById('w-product-stock').innerText = "Trong kho: " + item.stock;
                document.getElementById('withdraw-modal').classList.remove('hidden');
            });
        }

        function closeWithdraw() { document.getElementById('withdraw-modal').classList.add('hidden'); currentScanId = null; }

        function confirmWithdraw() {
            const qty = parseInt(document.getElementById('w-quantity').value);
            if(!qty || qty <= 0) return alert("Vui lòng nhập số lượng!");

            db.ref('inventory/' + currentScanId).once('value', (s) => {
                const item = s.val();
                if(qty > item.stock) return alert("Lỗi: Không đủ hàng!");

                const newStock = item.stock - qty;
                db.ref('inventory/' + currentScanId + '/stock').set(newStock, (e) => {
                    if(!e) {
                        // LƯU LỊCH SỬ VỚI ĐỦ THÔNG TIN ĐỂ LỌC
                        db.ref('logs').push({
                            staffName: currentUser.name,
                            staffPhone: currentUser.phone,
                            prodName: item.name,
                            qty: qty,
                            time: Date.now()
                        });
                        alert("Xong!");
                        closeWithdraw();
                        document.getElementById('w-quantity').value = "";
                    }
                });
            });
        }

        // HÀM ĐỔI NGÀY GIỜ DỄ ĐỌC
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return (d.getHours() < 10 ? '0' : '') + d.getHours() + ":" + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() + " - " + d.getDate() + "/" + (d.getMonth() + 1);
        }

        function printQR(id, name) {
            const win = window.open('', '_blank');
            win.document.write(`<html><body style="text-align:center;padding-top:100px;font-family:sans-serif"><h1>SẢN PHẨM: ${name}</h1><h3>ID: ${id}</h3><div id="q" style="display:inline-block"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById("q"), {text:"${id}", width:350, height:350}); setTimeout(()=>window.print(), 500);<\/script></body></html>`);
            win.document.close();
        }
    </script>
</body>
</html>
