<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Kho QR - Quản Lý Toàn Diện</title>
    
    <!-- Firebase & Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap');
        body { font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .qr-canvas canvas { display: inline-block !important; border: 3px solid white; border-radius: 10px; }
        .btn-press:active { transform: scale(0.95); }
        #reader video { border-radius: 20px !important; object-fit: cover !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- LOADER -->
    <div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-blue-600">ĐANG TẢI DỮ LIỆU...</p>
    </div>

    <!-- TRANG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-page" class="hidden min-h-screen flex items-center justify-center p-4 bg-blue-600">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-md">
            <h2 id="auth-title" class="text-3xl font-extrabold text-center text-slate-800 mb-8 uppercase tracking-tighter">Đăng Nhập</h2>
            
            <div id="login-form" class="space-y-4">
                <input type="text" id="login-user" placeholder="Số điện thoại hoặc Admin" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                <input type="password" id="login-pass" placeholder="Mật khẩu" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-lg shadow-lg btn-press">VÀO HỆ THỐNG</button>
                <button onclick="toggleAuth(true)" class="w-full text-blue-600 font-bold text-sm">Chưa có tài khoản? Đăng ký</button>
            </div>

            <div id="register-form" class="hidden space-y-4">
                <input type="text" id="reg-name" placeholder="Họ tên nhân viên" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500 font-medium">
                <input type="text" id="reg-phone" placeholder="Số điện thoại" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500 font-medium">
                <input type="password" id="reg-pass" placeholder="Mật khẩu tự chọn" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500 font-medium">
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white p-4 rounded-2xl font-black text-lg shadow-lg btn-press">ĐĂNG KÝ TÀI KHOẢN</button>
                <button onclick="toggleAuth(false)" class="w-full text-slate-500 font-bold text-sm text-center block w-full">Quay lại Đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- TRANG ADMIN -->
    <div id="admin-page" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50">
            <span class="font-black text-blue-600 uppercase tracking-tighter">Admin Quản Lý</span>
            <button onclick="logout()" class="text-red-500 font-bold text-xs uppercase">Thoát</button>
        </nav>

        <main class="p-4 max-w-6xl mx-auto space-y-8">
            <!-- Khu vực nhập hàng -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-black text-slate-800 mb-6 text-sm uppercase">Nhập hàng mới</h3>
                    <div class="space-y-3">
                        <input type="text" id="p-name" placeholder="Tên sản phẩm" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500">
                        <input type="text" id="p-id" placeholder="Mã QR định danh" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500 uppercase">
                        <input type="number" id="p-stock" placeholder="Số lượng" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="adminUpdateStock()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-black btn-press">LƯU SẢN PHẨM</button>
                    </div>
                </div>

                <!-- Bảng nhân viên (Yêu cầu của bạn) -->
                <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-800 text-white font-black text-[10px] uppercase tracking-widest">Danh sách nhân viên & Mật khẩu</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b">
                                <tr>
                                    <th class="p-4">Nhân viên</th>
                                    <th class="p-4">Số điện thoại</th>
                                    <th class="p-4">Mật khẩu</th>
                                    <th class="p-4 text-right">Xóa</th>
                                </tr>
                            </thead>
                            <tbody id="admin-staff-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Bảng hàng hóa -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-blue-600 text-white font-black text-[10px] uppercase tracking-widest text-center">Danh mục hàng tồn kho</div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b">
                            <tr><th class="p-6">Mã QR</th><th class="p-6">Tên hàng</th><th class="p-6 text-center">Số lượng</th><th class="p-6 text-right font-bold">Sửa/Xóa</th></tr>
                        </thead>
                        <tbody id="admin-inventory-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- TRANG NHÂN VIÊN -->
    <div id="staff-page" class="hidden">
        <nav class="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-50">
            <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nhân viên</p><p id="staff-display-name" class="font-black text-blue-600"></p></div>
            <button onclick="logout()" class="text-slate-400 font-bold text-xs uppercase">Thoát</button>
        </nav>

        <div class="p-4 max-w-md mx-auto space-y-6">
            <button onclick="openScanner()" class="w-full bg-blue-600 text-white p-6 rounded-[2rem] font-black text-xl shadow-xl flex items-center justify-center gap-4 btn-press">QUÉT MÃ LẤY HÀNG</button>
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400">Danh mục hàng hóa</div>
                <div id="staff-inventory-list" class="divide-y divide-slate-100"></div>
            </div>
        </div>
    </div>

    <!-- SCANNER MODAL -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden flex flex-col items-center justify-center p-6">
        <div id="reader" class="w-full max-w-sm overflow-hidden"></div>
        <button onclick="closeScanner()" class="mt-8 bg-white/20 text-white px-8 py-3 rounded-full font-bold">ĐÓNG CAMERA</button>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-6 right-6 w-80 space-y-3 z-[9999] pointer-events-none"></div>

    <script>
        // Cấu hình Firebase (Thay link database của bạn)
        const firebaseConfig = {
            apiKey: "AIzaSyDc-VCCLr_IeQIH42OYsyLjOaQq5YgJ5DE",
            authDomain: "khoqr-d67fd.firebaseapp.com",
            databaseURL: "https://khoqr-d67fd-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "khoqr-d67fd",
            storageBucket: "khoqr-d67fd.firebasestorage.app",
            messagingSenderId: "100113337906",
            appId: "1:100113337906:web:83b8cfc0b2d3679b8e362b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = JSON.parse(localStorage.getItem('kho_session_pro'));
        let scanner = null;

        window.onload = () => {
            document.getElementById('loader').classList.add('hidden');
            if(currentUser) { renderUI(); } 
            else { document.getElementById('auth-page').classList.remove('hidden'); }
        };

        function renderUI() {
            document.getElementById('auth-page').classList.add('hidden');
            if(currentUser.role === 'admin') {
                document.getElementById('admin-page').classList.remove('hidden');
                initAdmin();
            } else {
                document.getElementById('staff-page').classList.remove('hidden');
                document.getElementById('staff-display-name').innerText = currentUser.name;
                initStaff();
            }
        }

        function toggleAuth(isReg) {
            document.getElementById('login-form').classList.toggle('hidden', isReg);
            document.getElementById('register-form').classList.toggle('hidden', !isReg);
            document.getElementById('auth-title').innerText = isReg ? 'ĐĂNG KÝ' : 'ĐĂNG NHẬP';
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;
            if(!name || !phone || !pass) return alert("Vui lòng điền đủ thông tin!");

            db.ref('users/' + phone).set({ name, phone, pass, role: 'staff' }, (err) => {
                if(!err) {
                    alert("Đăng ký thành công! Đang chuyển về Đăng nhập.");
                    // Xóa trắng ô nhập
                    document.getElementById('reg-name').value = ""; document.getElementById('reg-phone').value = ""; document.getElementById('reg-pass').value = "";
                    toggleAuth(false);
                } else { alert("Lỗi khi lưu vào database!"); }
            });
        }

        function handleLogin() {
            const userIn = document.getElementById('login-user').value;
            const passIn = document.getElementById('login-pass').value;

            if(userIn === 'Admin' && passIn === '3032002') {
                saveSession({ name: 'Admin Tổng', role: 'admin' });
            } else {
                db.ref('users/' + userIn).once('value', (s) => {
                    const u = s.val();
                    if(u && u.pass === passIn) saveSession(u);
                    else alert("Sai tài khoản hoặc mật khẩu!");
                });
            }
        }

        function saveSession(u) {
            localStorage.setItem('kho_session_pro', JSON.stringify(u));
            location.reload();
        }

        function logout() { localStorage.removeItem('kho_session_pro'); location.reload(); }

        function initAdmin() {
            // Lấy danh sách hàng hóa
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('admin-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-6"><div id="qr-${id}" class="qr-canvas"></div></td>
                            <td class="p-6"><b>${item.name}</b><br><span class="text-[10px] text-slate-300 uppercase">${id}</span></td>
                            <td class="p-6 text-center text-xl font-black text-blue-600">${item.stock}</td>
                            <td class="p-6 text-right space-x-4">
                                <button onclick="editStock('${id}')" class="text-blue-500 font-bold text-xs uppercase">Nhập hàng</button>
                                <button onclick="deleteProduct('${id}')" class="text-red-300 font-bold text-xs uppercase">Xóa</button>
                            </td>
                        </tr>
                    `);
                    new QRCode(document.getElementById(`qr-${id}`), { text: id, width: 60, height: 60 });
                }
            });

            // Lấy danh sách nhân viên (Theo yêu cầu của bạn)
            db.ref('users').on('value', (s) => {
                const users = s.val();
                const list = document.getElementById('admin-staff-list');
                list.innerHTML = "";
                for(let phone in users) {
                    const u = users[phone];
                    if(u.role === 'staff') {
                        list.insertAdjacentHTML('beforeend', `
                            <tr>
                                <td class="p-4 font-bold text-slate-700">${u.name}</td>
                                <td class="p-4 font-mono">${u.phone}</td>
                                <td class="p-4 text-blue-600 font-black tracking-widest">${u.pass}</td>
                                <td class="p-4 text-right"><button onclick="deleteUser('${phone}')" class="text-red-300">✕</button></td>
                            </tr>
                        `);
                    }
                }
            });

            db.ref('logs').limitToLast(1).on('child_added', (s) => {
                const log = s.val();
                if(Date.now() - log.time < 5000) showToast(log.staff, log.prod, log.qty);
            });
        }

        function adminUpdateStock() {
            const name = document.getElementById('p-name').value;
            const id = document.getElementById('p-id').value.toUpperCase().trim();
            const stock = parseInt(document.getElementById('p-stock').value);
            if(!name || !id || isNaN(stock)) return alert("Điền đủ thông tin!");
            db.ref('inventory/' + id).set({ name, stock }, () => {
                document.getElementById('p-name').value = ""; document.getElementById('p-id').value = ""; document.getElementById('p-stock').value = "";
            });
        }

        function editStock(id) {
            const n = prompt("Số lượng thực tế trong kho sau khi nhập thêm:");
            if(n !== null) db.ref('inventory/' + id + '/stock').set(parseInt(n));
        }

        function deleteProduct(id) { if(confirm("Xóa hàng này?")) db.ref('inventory/' + id).remove(); }
        
        function deleteUser(phone) { if(confirm("Xóa nhân viên này?")) db.ref('users/' + phone).remove(); }

        function initStaff() {
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('staff-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <div class="p-5 flex justify-between items-center bg-white">
                            <div><p class="font-bold text-slate-700">${item.name}</p><p class="text-[10px] text-slate-300 font-mono">${id}</p></div>
                            <div class="text-right"><p class="text-[10px] font-black text-slate-300 uppercase">Còn</p><p class="text-xl font-black text-blue-600">${item.stock}</p></div>
                        </div>
                    `);
                }
            });
        }

        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            if(!scanner) scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => {
                closeScanner();
                processWithdraw(text);
            }).catch(err => alert("Lỗi camera!"));
        }

        function closeScanner() {
            if(scanner) scanner.stop();
            document.getElementById('scanner-modal').classList.add('hidden');
        }

        function processWithdraw(pid) {
            db.ref('inventory/' + pid).once('value', (s) => {
                const item = s.val();
                if(!item) return alert("QR không tồn tại!");
                const qtyStr = prompt(`LẤY HÀNG: ${item.name}\nHiện có: ${item.stock}\nNhập số lượng lấy:`, "1");
                const qty = parseInt(qtyStr);
                if(qty > 0 && qty <= item.stock) {
                    db.ref('inventory/' + pid + '/stock').set(item.stock - qty);
                    db.ref('logs').push({ staff: currentUser.name, prod: item.name, qty: qty, time: Date.now() });
                    alert("Xong!");
                } else { alert("Số lượng sai!"); }
            });
        }

        function showToast(staff, prod, qty) {
            const container = document.getElementById('toast-container');
            const id = Date.now();
            const toast = `<div id="toast-${id}" class="bg-slate-900 text-white p-5 rounded-2xl shadow-2xl border-l-4 border-blue-500 animate-pulse text-sm"><b>${staff}</b> vừa lấy <b>${qty} ${prod}</b></div>`;
            container.insertAdjacentHTML('afterbegin', toast);
            setTimeout(() => { document.getElementById(`toast-${id}`)?.remove(); }, 8000);
        }
    </script>
</body>
</html>
