<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KHO QR AUTOMATIC</title>
    
    <!-- Firebase & Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap');
        body { font-family: 'Lexend', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
        .hidden { display: none !important; }
        .btn-active:active { transform: scale(0.95); transition: 0.1s; }
        .qr-canvas canvas { display: inline-block !important; border: 4px solid white; border-radius: 12px; shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #reader video { border-radius: 20px !important; object-fit: cover !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- MÀN HÌNH CHỜ -->
    <div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-blue-600 animate-pulse text-xs uppercase tracking-widest">Đang kết nối...</p>
    </div>

    <!-- TRANG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-page" class="hidden min-h-screen flex items-center justify-center p-6 bg-blue-600">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md">
            <h2 id="auth-title" class="text-3xl font-black text-center text-slate-800 mb-8 uppercase tracking-tighter">Đăng Nhập</h2>
            <div id="login-form" class="space-y-4 text-center">
                <input type="text" id="login-user" placeholder="SĐT hoặc 'Admin'" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-center border-none">
                <input type="password" id="login-pass" placeholder="Mật khẩu" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-center border-none">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-5 rounded-3xl font-black text-xl shadow-xl btn-active uppercase">VÀO HỆ THỐNG</button>
                <button onclick="toggleAuth(true)" class="w-full text-blue-600 font-bold text-xs uppercase tracking-widest">Đăng ký nhân viên mới</button>
            </div>
            <div id="register-form" class="hidden space-y-4">
                <input type="text" id="reg-name" placeholder="Tên nhân viên" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-green-500 font-bold text-center border-none">
                <input type="text" id="reg-phone" placeholder="Số điện thoại" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-green-500 font-bold text-center border-none">
                <input type="password" id="reg-pass" placeholder="Mật khẩu tự chọn" class="w-full p-4 bg-slate-100 rounded-3xl outline-none focus:ring-2 focus:ring-green-500 font-bold text-center border-none">
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white p-5 rounded-3xl font-black text-xl shadow-xl btn-active uppercase">Tạo tài khoản</button>
                <button onclick="toggleAuth(false)" class="w-full text-slate-500 font-bold text-xs uppercase text-center block w-full">Quay lại</button>
            </div>
        </div>
    </div>

    <!-- TRANG ADMIN -->
    <div id="admin-page" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <span class="font-black text-blue-600 uppercase tracking-tighter">Admin Quản Lý</span>
            <button onclick="logout()" class="text-red-500 font-bold text-xs border border-red-100 px-3 py-1 rounded-lg">THOÁT</button>
        </nav>
        <main class="p-4 max-w-6xl mx-auto space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Nhập hàng -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-black text-slate-800 mb-6 text-xs uppercase tracking-widest text-blue-500">Nhập hàng mới</h3>
                    <div class="space-y-3">
                        <p class="text-[10px] text-slate-400 font-bold">1. Tên sản phẩm:</p>
                        <input type="text" id="p-name" placeholder="Ví dụ: Bơm bỗng rượu" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none font-bold">
                        <p class="text-[10px] text-slate-400 font-bold">2. Số lượng nhập:</p>
                        <input type="number" id="p-stock" placeholder="Ví dụ: 20" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none font-bold">
                        
                        <div class="p-3 bg-blue-50 rounded-xl">
                            <p class="text-[9px] text-blue-600 font-bold uppercase">Lưu ý: Mã QR sẽ được tự động tạo sau khi bấm Lưu.</p>
                        </div>

                        <button onclick="adminAddProduct()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-black btn-active uppercase shadow-lg">LƯU DATABASE</button>
                    </div>
                </div>
                <!-- Quản lý mật khẩu nhân viên -->
                <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-800 text-white font-black text-[10px] uppercase tracking-widest text-center">Danh sách nhân viên & Mật khẩu</div>
                    <div class="max-h-64 overflow-y-auto"><table class="w-full text-left text-xs"><tbody id="admin-staff-list" class="divide-y divide-slate-100"></tbody></table></div>
                </div>
            </div>
            <!-- Danh sách tồn kho -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-blue-600 text-white font-black text-[10px] uppercase tracking-widest text-center">Hàng tồn kho hiện tại</div>
                <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50 border-b"><tr><th class="p-6">Mã QR</th><th class="p-6">Tên sản phẩm</th><th class="p-6 text-center text-blue-600">Số lượng</th><th class="p-6 text-right">Xử lý</th></tr></thead><tbody id="admin-inventory-list" class="divide-y divide-slate-100"></tbody></table></div>
            </div>
        </main>
    </div>

    <!-- TRANG NHÂN VIÊN -->
    <div id="staff-page" class="hidden min-h-screen">
        <nav class="bg-white border-b p-5 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nhân viên kho</p><p id="staff-display-name" class="font-black text-blue-600 text-lg"></p></div>
            <button onclick="logout()" class="text-slate-300 font-bold text-xs uppercase underline">Thoát</button>
        </nav>
        <div class="p-4 max-w-md mx-auto space-y-6 text-center">
            <button onclick="openScanner()" class="w-full bg-blue-600 text-white p-8 rounded-[2.5rem] font-black text-2xl shadow-2xl flex flex-col items-center justify-center gap-4 btn-active border-b-[10px] border-blue-800 mt-4">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                QUÉT MÃ QR
            </button>
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b font-black text-[10px] uppercase text-slate-400 text-center tracking-widest italic">Hàng đang có trong kho</div>
                <div id="staff-inventory-list" class="divide-y divide-slate-100"></div>
            </div>
        </div>
    </div>

    <!-- SCANNER MODAL -->
    <div id="scanner-modal" class="fixed inset-0 bg-black z-[100] hidden flex flex-col items-center justify-center p-8">
        <div id="reader" class="w-full max-w-sm rounded-[3rem] overflow-hidden border-4 border-white shadow-2xl"></div>
        <button onclick="closeScanner()" class="mt-12 bg-white text-black px-12 py-4 rounded-full font-black uppercase text-xs tracking-widest btn-active">Đóng máy quét</button>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-6 right-6 w-80 space-y-3 z-[9999] pointer-events-none"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDc-VCCLr_IeQIH42OYsyLjOaQq5YgJ5DE",
            authDomain: "khoqr-d67fd.firebaseapp.com",
            databaseURL: "https://khoqr-d67fd-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "khoqr-d67fd",
            storageBucket: "khoqr-d67fd.firebasestorage.app",
            messagingSenderId: "100113337906",
            appId: "1:100113337906:web:83b8cfc0b2d3679b8e362b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let currentUser = JSON.parse(localStorage.getItem('kho_session_v4'));
        let scanner = null;

        function hideLoader() {
            const l = document.getElementById('loader');
            if(l) { l.style.opacity = '0'; setTimeout(() => { l.classList.add('hidden'); if(!currentUser) document.getElementById('auth-page').classList.remove('hidden'); else renderUI(); }, 500); }
        }

        window.onload = () => { setTimeout(hideLoader, 3000); auth.signInAnonymously().then(hideLoader).catch(hideLoader); };

        function renderUI() {
            document.getElementById('auth-page').classList.add('hidden');
            if(currentUser.role === 'admin') { document.getElementById('admin-page').classList.remove('hidden'); initAdmin(); } 
            else { document.getElementById('staff-page').classList.remove('hidden'); document.getElementById('staff-display-name').innerText = currentUser.name; initStaff(); }
        }

        function toggleAuth(reg) {
            document.getElementById('login-form').classList.toggle('hidden', reg);
            document.getElementById('register-form').classList.toggle('hidden', !reg);
            document.getElementById('auth-title').innerText = reg ? 'ĐĂNG KÝ' : 'ĐĂNG NHẬP';
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;
            if(name && phone && pass) db.ref('users/' + phone).set({ name, phone, pass, role: 'staff' }, (err) => { if(!err) { alert("Đăng ký thành công!"); toggleAuth(false); } });
        }

        function handleLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(u === 'Admin' && p === '3032002') saveSession({ name: 'Quản trị viên', role: 'admin' });
            else db.ref('users/' + u).once('value', (s) => { const user = s.val(); if(user && user.pass === p) saveSession(user); else alert("Sai tài khoản!"); });
        }

        function saveSession(u) { localStorage.setItem('kho_session_v4', JSON.stringify(u)); location.reload(); }
        function logout() { localStorage.removeItem('kho_session_v4'); location.reload(); }

        function initAdmin() {
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('admin-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <tr class="border-b border-slate-50">
                            <td class="p-6"><div id="qr-${id}" class="qr-canvas" onclick="printQR('${id}', '${item.name}')"></div></td>
                            <td class="p-6 font-bold text-slate-700 italic">${item.name}<br><span class="text-[9px] text-slate-300 font-mono tracking-widest uppercase">${id}</span></td>
                            <td class="p-6 text-center text-3xl font-black text-blue-600">${item.stock}</td>
                            <td class="p-6 text-right space-y-2">
                                <button onclick="adminEditStock('${id}')" class="text-blue-500 font-black text-[9px] uppercase block ml-auto underline">Sửa</button>
                                <button onclick="adminDeleteItem('${id}')" class="text-red-300 font-black text-[9px] uppercase block ml-auto">Xóa</button>
                            </td>
                        </tr>
                    `);
                    new QRCode(document.getElementById(`qr-${id}`), { text: id, width: 64, height: 64 });
                }
            });
            db.ref('users').on('value', (s) => {
                const users = s.val();
                const list = document.getElementById('admin-staff-list');
                list.innerHTML = "";
                for(let phone in users) {
                    const u = users[phone];
                    if(u.role === 'staff') {
                        list.insertAdjacentHTML('beforeend', `
                            <tr class="border-b border-slate-50 text-[11px]">
                                <td class="p-3 font-bold text-slate-700">${u.name}</td>
                                <td class="p-3 text-slate-400 font-mono text-center">${u.phone}</td>
                                <td class="p-3 text-blue-500 font-black text-center tracking-widest">${u.pass}</td>
                                <td class="p-3 text-right"><button onclick="adminDeleteUser('${phone}')" class="text-red-200 font-bold text-lg">✕</button></td>
                            </tr>
                        `);
                    }
                }
            });
            db.ref('logs').limitToLast(1).on('child_added', (s) => { const log = s.val(); if(Date.now() - log.time < 5000) showAdminToast(log.staff, log.prod, log.qty); });
        }

        // TỰ ĐỘNG TẠO MÃ QR TRONG CODE
        function adminAddProduct() {
            const name = document.getElementById('p-name').value.trim();
            const stock = parseInt(document.getElementById('p-stock').value);
            
            if(!name || isNaN(stock)) return alert("Vui lòng nhập tên và số lượng!");
            
            // TỰ ĐỘNG TẠO ID DUY NHẤT: SP + 6 số cuối của thời gian hiện tại
            const autoId = "SP" + Date.now().toString().slice(-6);

            db.ref('inventory/' + autoId).set({ name, stock }, (err) => {
                if(!err) {
                    alert("Đã lưu! Mã QR cho [" + name + "] là: " + autoId);
                    document.getElementById('p-name').value = "";
                    document.getElementById('p-stock').value = "";
                }
            });
        }

        function adminEditStock(id) { const n = prompt("Số lượng mới:"); if(n !== null) db.ref('inventory/' + id + '/stock').set(parseInt(n)); }
        function adminDeleteItem(id) { if(confirm("Xóa?")) db.ref('inventory/' + id).remove(); }
        function adminDeleteUser(phone) { if(confirm("Xóa?")) db.ref('users/' + phone).remove(); }

        function printQR(id, name) {
            const win = window.open('', '_blank');
            win.document.write(`<html><body style="text-align:center;padding-top:100px;font-family:sans-serif"><h1>SẢN PHẨM: ${name}</h1><h3>Mã ID: ${id}</h3><div id="q" style="display:inline-block"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById("q"), {text:"${id}", width:350, height:350}); setTimeout(()=>window.print(), 500);<\/script></body></html>`);
            win.document.close();
        }

        function initStaff() {
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const list = document.getElementById('staff-inventory-list');
                list.innerHTML = "";
                for(let id in data) {
                    const item = data[id];
                    list.insertAdjacentHTML('beforeend', `
                        <div class="p-6 flex justify-between items-center bg-white border-b border-slate-50">
                            <div><p class="font-bold text-slate-700 italic uppercase">${item.name}</p><p class="text-[9px] text-slate-300 font-mono tracking-widest">${id}</p></div>
                            <div class="text-right"><p class="text-[9px] font-black text-slate-300 uppercase italic">Số lượng tồn</p><p class="text-2xl font-black text-blue-600">${item.stock}</p></div>
                        </div>
                    `);
                }
            });
        }

        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            if(!scanner) scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                closeScanner();
                db.ref('inventory/' + text).once('value', (s) => {
                    const item = s.val();
                    if(!item) return alert("Mã sai!");
                    const qtyStr = prompt("Lấy " + item.name + ". Bạn lấy bao nhiêu cái?", "1");
                    const qty = parseInt(qtyStr);
                    if(qty > 0 && item.stock >= qty) {
                        db.ref('inventory/' + text + '/stock').set(item.stock - qty, (err) => { if(!err) { db.ref('logs').push({ staff: currentUser.name, prod: item.name, qty: qty, time: Date.now() }); alert("Xong!"); } });
                    } else alert("Lỗi!");
                });
            }).catch(err => alert("Camera lỗi!"));
        }

        function closeScanner() { if(scanner) scanner.stop(); document.getElementById('scanner-modal').classList.add('hidden'); }

        function showAdminToast(staff, prod, qty) {
            const container = document.getElementById('toast-container');
            const id = Date.now();
            const toast = `<div id="toast-${id}" class="bg-blue-900 text-white p-6 rounded-[2rem] shadow-2xl border-l-[12px] border-blue-400 animate-bounce transition-all"><p class="text-[10px] font-black text-blue-300 uppercase italic mb-1 tracking-widest">Cập nhật kho:</p><p class="text-sm"><b>${staff}</b> vừa lấy <b>${qty} ${prod}</b></p></div>`;
            container.insertAdjacentHTML('afterbegin', toast);
            setTimeout(() => { document.getElementById(`toast-${id}`)?.remove(); }, 10000);
        }
    </script>
</body>
</html>
