<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Kho Đám Mây Pro</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- UI & QR Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .hidden { display: none; }
        input { font-size: 16px !important; }
        .notification { animation: slideIn 0.5s ease-out; z-index: 9999; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .qr-small img { display: inline-block !important; border: 2px solid #eee; padding: 2px; background: white; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="loading" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-[100]">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-blue-600 font-bold">ĐANG KẾT NỐI ĐÁM MÂY...</p>
    </div>

    <!-- GIAO DIỆN ĐĂNG NHẬP -->
    <div id="login-page" class="flex items-center justify-center min-h-screen p-4 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-blue-600">
            <h2 id="auth-title" class="text-3xl font-extrabold mb-8 text-center text-gray-800 tracking-tight">ĐĂNG NHẬP</h2>
            
            <div id="login-form">
                <div class="space-y-4">
                    <input type="text" id="user-in" placeholder="SĐT hoặc 'Admin'" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <input type="password" id="pass-in" placeholder="Mật khẩu" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold text-lg mt-8 shadow-lg hover:bg-blue-700 active:scale-95 transition">VÀO HỆ THỐNG</button>
                <div class="mt-6 text-center text-sm text-gray-500">
                    Chưa có tài khoản? <button onclick="toggleAuth(true)" class="text-blue-600 font-bold hover:underline">Đăng ký nhân viên</button>
                </div>
            </div>

            <div id="register-form" class="hidden">
                <div class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Họ tên nhân viên" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-green-500 transition">
                    <input type="text" id="reg-phone" placeholder="Số điện thoại đăng nhập" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-green-500 transition">
                    <input type="password" id="reg-pass" placeholder="Mật khẩu tự chọn" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-green-500 transition">
                </div>
                <button onclick="handleRegister()" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold text-lg mt-8 shadow-lg hover:bg-green-700 active:scale-95 transition">TẠO TÀI KHOẢN</button>
                <div class="mt-6 text-center text-sm text-gray-500">
                    Đã có tài khoản? <button onclick="toggleAuth(false)" class="text-blue-600 font-bold hover:underline">Quay lại Đăng nhập</button>
                </div>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN ADMIN -->
    <div id="admin-page" class="hidden">
        <nav class="bg-gray-900 text-white p-5 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span class="font-black tracking-widest text-lg">ADMIN KHO</span>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold text-sm transition">THOÁT</button>
        </nav>
        
        <div class="p-4 lg:p-10 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Nhập -->
            <div class="bg-white p-8 rounded-2xl shadow-xl h-fit border border-gray-100">
                <h3 class="font-black mb-6 text-gray-800 text-xl border-b pb-4 uppercase">Nhập hàng mới</h3>
                <div class="space-y-4">
                    <input type="text" id="p-name" placeholder="Tên sản phẩm" class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="p-id" placeholder="Mã QR định danh (VD: SP01)" class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="p-stock" placeholder="Số lượng tồn kho" class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="addProduct()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">ĐƯA LÊN ĐÁM MÂY</button>
                </div>
            </div>

            <!-- Bảng Kho -->
            <div class="lg:col-span-2 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                <h3 class="font-black mb-6 text-gray-800 text-xl border-b pb-4 uppercase text-center">Danh sách tồn kho thực tế</h3>
                <div class="overflow-x-auto text-sm">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 uppercase">
                                <th class="p-4">Ảnh Mã QR</th>
                                <th class="p-4">Sản phẩm</th>
                                <th class="p-4 text-center">Số lượng</th>
                                <th class="p-4 text-right">Quản lý</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN NHÂN VIÊN -->
    <div id="staff-page" class="hidden p-4 min-h-screen flex flex-col items-center justify-center">
        <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl border border-gray-100 text-center">
            <h1 class="text-3xl font-black text-blue-600 mb-2">QUÉT MÃ XUẤT KHO</h1>
            <p class="text-gray-400 mb-8 italic">Xin chào, <span id="staff-name-display" class="text-gray-800 font-bold not-italic"></span></p>
            
            <div id="reader" class="mx-auto rounded-3xl overflow-hidden bg-black mb-8 shadow-inner border-8 border-gray-50" style="width: 100%; aspect-ratio: 1/1;"></div>
            
            <button onclick="startScanner()" class="w-full bg-blue-600 text-white p-6 rounded-2xl font-black text-xl shadow-xl active:scale-95 transition flex items-center justify-center space-x-3">
                <span>MỞ CAMERA QUÉT</span>
            </button>
            
            <button onclick="logout()" class="mt-8 text-gray-400 font-bold hover:text-red-500 transition">ĐĂNG XUẤT</button>
        </div>
    </div>

    <!-- KHU VỰC THÔNG BÁO -->
    <div id="notification-area" class="fixed bottom-5 right-5 w-80 space-y-3 pointer-events-none"></div>

    <script>
        // --- 1. CẤU HÌNH FIREBASE CỦA BẠN (ĐÃ TỰ ĐỘNG ĐIỀN) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDc-VCCLr_IeQIH42OYsyLjOaQq5YgJ5DE",
            authDomain: "khoqr-d67fd.firebaseapp.com",
            databaseURL: "https://khoqr-d67fd-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "khoqr-d67fd",
            storageBucket: "khoqr-d67fd.firebasestorage.app",
            messagingSenderId: "100113337906",
            appId: "1:100113337906:web:83b8cfc0b2d3679b8e362b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem('savedUser'));

        // --- 2. ĐIỀU HƯỚNG ---
        window.onload = function() {
            document.getElementById('loading').classList.add('hidden');
            if(currentUser) {
                if(currentUser.role === 'admin') {
                    showPage('admin-page');
                    loadAdminData();
                } else {
                    showPage('staff-page');
                    document.getElementById('staff-name-display').innerText = currentUser.name;
                }
            } else {
                showPage('login-page');
            }
        };

        function showPage(pageId) {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('admin-page').classList.add('hidden');
            document.getElementById('staff-page').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
        }

        // --- 3. ĐĂNG KÝ / ĐĂNG NHẬP ---
        function toggleAuth(reg) {
            document.getElementById('login-form').classList.toggle('hidden', reg);
            document.getElementById('register-form').classList.toggle('hidden', !reg);
            document.getElementById('auth-title').innerText = reg ? 'ĐĂNG KÝ' : 'ĐĂNG NHẬP';
        }

        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const pass = document.getElementById('reg-pass').value;
            if(!name || !phone || !pass) return alert("Vui lòng điền đủ 3 thông tin!");
            
            db.ref('users/' + phone).set({ name, phone, pass, role: 'staff' }, (err) => {
                if(!err) { alert("Đăng ký thành công! Hãy đăng nhập ngay."); toggleAuth(false); }
            });
        }

        function handleLogin() {
            const userIn = document.getElementById('user-in').value;
            const passIn = document.getElementById('pass-in').value;

            if(userIn === 'Admin' && passIn === '3032002') {
                loginSuccess({ name: 'Admin', role: 'admin' });
            } else {
                db.ref('users/' + userIn).once('value', (s) => {
                    const u = s.val();
                    if(u && u.pass === passIn) loginSuccess(u);
                    else alert("Sai tài khoản hoặc mật khẩu!");
                });
            }
        }

        function loginSuccess(user) {
            localStorage.setItem('savedUser', JSON.stringify(user));
            location.reload();
        }

        function logout() { localStorage.removeItem('savedUser'); location.reload(); }

        // --- 4. LOGIC QUẢN TRỊ ---
        function loadAdminData() {
            db.ref('inventory').on('value', (s) => {
                const data = s.val();
                const table = document.getElementById('inventory-table');
                table.innerHTML = "";
                for(let key in data) {
                    const item = data[key];
                    table.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4"><div id="qr-${key}" class="qr-small" onclick="printQR('${key}')"></div></td>
                            <td class="p-4"><span class="font-black text-gray-800">${item.name}</span><br><span class="text-xs font-mono text-gray-400">${key}</span></td>
                            <td class="p-4 text-center font-black text-2xl text-blue-600">${item.stock}</td>
                            <td class="p-4 text-right space-y-1">
                                <button onclick="editStock('${key}')" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-md text-xs font-bold block ml-auto">SỬA KHO</button>
                                <button onclick="deleteItem('${key}')" class="bg-red-50 text-red-600 px-3 py-1 rounded-md text-xs font-bold block ml-auto uppercase">Xóa</button>
                            </td>
                        </tr>
                    `;
                    setTimeout(() => { new QRCode(document.getElementById(`qr-${key}`), { text: key, width: 60, height: 60 }); }, 50);
                }
            });

            db.ref('notifications').on('child_added', (s) => {
                const n = s.val();
                if(Date.now() - n.time < 15000) showToast(n.staff, n.prod, n.qty);
            });
        }

        function addProduct() {
            const name = document.getElementById('p-name').value;
            const id = document.getElementById('p-id').value;
            const stock = parseInt(document.getElementById('p-stock').value);
            if(name && id && !isNaN(stock)) {
                db.ref('inventory/' + id).set({ name, stock });
                document.getElementById('p-name').value = ""; document.getElementById('p-id').value = ""; document.getElementById('p-stock').value = "";
            } else alert("Vui lòng điền đủ thông tin sản phẩm!");
        }

        function editStock(id) {
            const n = prompt("Số lượng tồn kho thực tế hiện tại là bao nhiêu?");
            if(n !== null) db.ref('inventory/' + id + '/stock').set(parseInt(n));
        }

        function deleteItem(id) {
            if(confirm("Xóa vĩnh viễn sản phẩm này khỏi hệ thống?")) db.ref('inventory/' + id).remove();
        }

        function printQR(id) {
            const win = window.open('', '_blank');
            win.document.write('<html><body style="text-align:center;padding:50px;">');
            win.document.write('<h1>MÃ QR SẢN PHẨM: ' + id + '</h1>');
            win.document.write('<div id="pqr"></div>');
            win.document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>');
            win.document.write('<script>new QRCode(document.getElementById("pqr"), {text:"' + id + '", width:300, height:300}); setTimeout(()=>window.print(), 500);<\/script>');
            win.document.write('</body></html>');
            win.document.close();
        }

        // --- 5. LOGIC NHÂN VIÊN ---
        function startScanner() {
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                scanner.stop();
                processExport(text);
            }).catch(err => alert("LỖI CAMERA: Vui lòng cho phép truy cập camera!"));
        }

        function processExport(pid) {
            db.ref('inventory/' + pid).once('value', (s) => {
                const item = s.val();
                if(!item) return alert("KHÔNG TÌM THẤY SẢN PHẨM NÀY!");
                const qtyStr = prompt(`XUẤT KHO: ${item.name}\nHiện có: ${item.stock}\nBạn lấy bao nhiêu cái?`, "1");
                const qty = parseInt(qtyStr);
                if(qty > 0 && item.stock >= qty) {
                    db.ref('inventory/' + pid + '/stock').set(item.stock - qty);
                    db.ref('notifications').push({ staff: currentUser.name, prod: item.name, qty, time: Date.now() });
                    alert("XUẤT KHO THÀNH CÔNG!");
                } else { alert("LỖI: Số lượng không hợp lệ hoặc kho không đủ hàng!"); }
            });
        }

        function showToast(staff, prod, qty) {
            const area = document.getElementById('notification-area');
            const t = document.createElement('div');
            t.className = "notification bg-gray-900 text-white p-5 rounded-2xl shadow-2xl border-l-8 border-blue-500 pointer-events-auto";
            t.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <span class="text-[10px] bg-blue-600 px-2 py-0.5 rounded uppercase font-black">Thông báo mới</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-gray-500">✕</button>
                </div>
                <p class="text-sm">Nhân viên <b class="text-blue-400">${staff}</b> vừa lấy <b class="text-xl">${qty}</b> cái <b class="text-blue-400">${prod}</b></p>
            `;
            area.prepend(t);
            setTimeout(() => t.remove(), 12000);
        }
    </script>
</body>
</html>
